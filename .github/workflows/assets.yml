# Build the page and put it on the "demo" release as demo.tar.gz.
# The yzma.ai site gets this file at each build.
name: assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, and let a running one finish.
concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: '0.42.0'
      BUILD_DIR: build
      HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install TinyGo
        run: |
          set -e
          curl -sSL -o tinygo.deb https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb
          sudo dpkg -i tinygo.deb
          tinygo version

      - name: Build the page
        run: make build

      - name: Make the tarball
        run: tar -czf demo.tar.gz -C ${BUILD_DIR} .

      - name: Publish the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view demo >/dev/null 2>&1 || \
            gh release create demo --title "Demo build" \
              --notes "The newest build of the page."
          gh release upload demo demo.tar.gz --clobber

      # The site rebuilds only when something starts it. The secret is
      # optional, and without it the site takes the new build at its next one.
      - name: Start a build of the site
        if: env.HOOK != ''
        run: curl -fsS -X POST -d '{}' "$HOOK"

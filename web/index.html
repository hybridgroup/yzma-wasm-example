<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yzma chat</title>
    <link rel="icon" href="data:," />

    <!-- GitHub Pages cannot send the COOP and COEP headers, so the page gets
         no SharedArrayBuffer. This service worker adds them. -->
    <script src="coi-serviceworker.js"></script>

    <link rel="stylesheet" href="min.css" />
    <style>
      body { color: #222; }
      .container { max-width: 46rem; }

      .nav { padding: 14px 20px 18px; height: auto; }
      .nav .pagename { font-size: 28px; font-weight: 700; top: 0; }
      .nav .backend { color: #aaa; float: right; font-size: 13px; top: 12px; position: relative; }

      h2 { font-size: 1.4em; margin: 1.4em 0 0.4em; }

      .setup { display: flex; gap: 8px; align-items: center; }
      .setup input { flex: 1; width: auto; font-size: 15px; }

      /* min.css does not dim a button that the page turned off. */
      .btn:disabled, .btn:disabled:hover { background: #ccc; cursor: default; }

      #bar {
        appearance: none;
        border: 0;
        display: block;
        height: 10px;
        margin-top: 10px;
        width: 100%;
      }
      /* An id beats the [hidden] rule of the browser, so say it again. */
      #bar[hidden] { display: none; }
      #bar::-webkit-progress-bar { background: #eee; border-radius: 5px; }
      #bar::-webkit-progress-value { background: #0ae; border-radius: 5px; }
      #bar::-moz-progress-bar { background: #0ae; border-radius: 5px; }

      #system { width: 100%; box-sizing: border-box; font-size: 15px; resize: vertical; }

      #transcript { margin: 0.6em 0; }
      #transcript:empty::after {
        content: "Load a model, then say something.";
        color: #999;
      }
      .msg {
        font-size: 17px;
        line-height: 1.55;
        margin-bottom: 0.75em;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .msg.you { background: #eee; border-left-color: #999; }

      .compose { display: flex; gap: 8px; align-items: flex-start; }
      .compose textarea { flex: 1; width: auto; font-size: 16px; resize: vertical; }

      #status { color: #777; font-size: 13px; margin: 0.75em 0 1.5em; min-height: 1.2em; }
      #status.bad { color: #d33; }
    </style>
  </head>

  <body>
    <div class="nav">
      <div class="container">
        <span class="pagename">yzma chat</span>
        <span class="backend" id="backend">looking for a backend</span>
      </div>
    </div>

    <div class="container">
      <p>
        This page runs a language model completely in the local browser using WebAssembly. There is no server, no API key, and no data goes anywhere.
        Written in Go using <a target="_blank" href="https://github.com/hybridgroup/yzma">yzma</a> on <a target="_blank" href="https://tinygo.org/">TinyGo</a>.
        <a target="_blank" href="https://github.com/hybridgroup/yzma-wasm-example">Source code is available here</a>.
      </p>

      <h2>Model</h2>

      <div class="setup">
        <input
          id="model"
          type="text"
          aria-label="Model URL"
          value="https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
        />
        <button id="load" class="btn btn-a btn-sm">Load</button>
      </div>

      <progress id="bar" max="100" value="0" hidden></progress>

      <h2>System prompt</h2>

      <textarea id="system" rows="2" aria-label="System prompt"
        placeholder="Tell the model how to answer"></textarea>

      <h2>Chat</h2>

      <div id="transcript"></div>

      <div class="compose">
        <textarea id="prompt" rows="2" aria-label="Message" placeholder="Ask something"></textarea>
        <button id="send" class="btn btn-a btn-sm" disabled>Send</button>
        <button id="reset" class="btn btn-sm" disabled>New</button>
      </div>

      <div id="status">starting</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const transcript = $("transcript");

      // ?mode=cpu or ?mode=webgpu passes through to the worker.
      const mode = new URLSearchParams(location.search).get("mode");
      const worker = new Worker("./worker.js" + (mode ? "?mode=" + encodeURIComponent(mode) : ""));

      let answer = null; // the bubble that the tokens go into
      let ready = false; // a model is loaded
      let downloading = false;

      function say(who, text) {
        const bubble = document.createElement("div");
        bubble.className = who === "you" ? "msg you" : "msg";
        bubble.textContent = text;
        transcript.appendChild(bubble);
        bubble.scrollIntoView({ block: "end" });
        return bubble;
      }

      function status(text, bad) {
        $("status").textContent = text;
        $("status").className = bad ? "bad" : "";
      }

      // bar shows how much of the model came down. A percent of -1 hides it.
      function bar(percent) {
        $("bar").hidden = percent < 0;
        $("bar").value = percent < 0 ? 0 : percent;
      }

      // busy turns the controls off while the model works.
      function busy(yes) {
        $("send").disabled = yes || !ready;
        $("reset").disabled = yes || !ready;
        $("load").disabled = yes || downloading;
      }

      worker.onmessage = (event) => {
        const { kind, text } = event.data || {};
        switch (kind) {
          case "ready":
            $("backend").textContent = text;
            status("ready, load a model");
            break;
          case "system":
            $("system").value = text;
            break;
          case "status":
            status(text);
            break;
          case "progress":
            bar(parseInt(text, 10));
            status("downloading the model " + text);
            break;
          case "loaded":
            ready = true;
            downloading = false;
            bar(-1);
            busy(false);
            status(text);
            break;
          case "token":
            if (!answer) answer = say("them", "");
            answer.textContent += text;
            answer.scrollIntoView({ block: "end" });
            break;
          case "done":
            answer = null;
            busy(false);
            status(text);
            break;
          case "reset":
            transcript.replaceChildren();
            status("new conversation");
            break;
          case "error":
            answer = null;
            downloading = false;
            bar(-1);
            busy(false);
            status(text, true);
            break;
        }
      };

      $("load").onclick = () => {
        if (downloading) return;

        ready = false;
        downloading = true;
        transcript.replaceChildren();
        bar(0);
        busy(true);
        status("waiting for the worker");
        worker.postMessage({ kind: "load", url: $("model").value.trim() });
      };

      function send() {
        const text = $("prompt").value.trim();
        if (!text || !ready) return;

        say("you", text);
        $("prompt").value = "";
        answer = null;
        busy(true);
        status("thinking");

        // The system prompt can change between one question and the next.
        worker.postMessage({ kind: "system", text: $("system").value });
        worker.postMessage({ kind: "ask", text });
      }

      $("send").onclick = send;
      $("reset").onclick = () => {
        worker.postMessage({ kind: "system", text: $("system").value });
        worker.postMessage({ kind: "reset" });
      };

      // Enter sends, shift-Enter makes a new line.
      $("prompt").onkeydown = (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          send();
        }
      };
    </script>
  </body>
</html>
